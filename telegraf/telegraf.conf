[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  quiet = false
  debug = false
  omit_hostname = true

[[inputs.mqtt_consumer]]
  ## MQTT server(s) — use TLS with the plant CA
  servers = ["ssl://broker:8883"]

  ## Subscribe to all sensor and status topics
  topics = [
    "electrolyser/plant-A/#",
  ]
  qos = 1
  client_id = "telegraf-subscriber"

  ## mTLS — certificate paths are bind-mounted by docker-compose.yml
  tls_ca   = "/mosq-certs/ca.crt"
  tls_cert = "/mosq-certs/client.crt"
  tls_key  = "/mosq-certs/client.key"
  insecure_skip_verify = false

  ## Parse JSON payload
  ## Payload example:
  ##   {"el":"EL1","sensor":"cell_1_voltage","unit":"V",
  ##    "timestamp":1720000000.123,"value":1.95,"sequence_id":42}
  data_format = "json"

  ## Promote these string fields to InfluxDB tags for efficient querying
  tag_keys = ["el", "sensor", "unit", "site_id", "stack_id", "sensor_id"]

  ## Use the embedded ISO-8601 UTC timestamp as the measurement time.
  ## Without this Telegraf uses wall-clock arrival time instead.
  json_time_key    = "ts"
  json_time_format = "RFC3339"

  ## Numeric fields to store as InfluxDB fields (not tags)
  ## value and sequence_id are captured automatically; cell is numeric.
  json_name_key = "sensor_id"

  name_override = "electrolyser_sensor"

[[outputs.influxdb_v2]]
  ## InfluxDB v2 endpoint — credentials injected from docker-compose environment
  urls         = ["http://influxdb:8086"]
  token        = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket       = "${INFLUX_BUCKET}"

  ## Retry on transient errors
  timeout = "5s"
